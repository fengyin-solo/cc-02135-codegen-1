<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault - 安全文件传输</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body>
    <div class="container">
        <!-- 用户状态栏 -->
        <div id="userBar" class="user-bar hidden">
            <span class="user-info">
                <span class="user-avatar" id="userAvatar">A</span>
                <span id="currentUser">未登录</span>
                <button class="logout-btn" onclick="logout()" title="退出登录">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </span>
        </div>

        <!-- ============ 文件目录视图 ============ -->
        <div id="directoryView">
            <h1>CloudVault</h1>
            <p class="subtitle">安全、快速、可靠的文件传输平台</p>

            <!-- 上传区域 -->
            <div class="upload-section">
                <h2>上传文件</h2>
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">☁️</div>
                    <p class="upload-text">拖放文件到此处，或点击选择</p>
                    <p class="upload-hint">支持 PDF、图片、文档、压缩包等格式，最大 50MB</p>
                </div>
                <input type="file" id="fileInput" hidden>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    <span>选择文件</span>
                </button>
                <div id="uploadStatus"></div>
            </div>

            <!-- 文件列表 -->
            <div class="file-list-section">
                <h2>文件库</h2>
                <div id="fileList" class="file-list"></div>
            </div>

            <!-- 我的分享 -->
            <div id="mySharesSection" class="file-list-section" style="display: none;">
                <h2>我的分享</h2>
                <div id="mySharesList" class="share-list"></div>
            </div>
        </div>

        <!-- ============ 文件预览与元数据视图 ============ -->
        <div id="previewView" class="preview-view" style="display: none;">
            <div class="preview-topbar">
                <button type="button" class="back-btn" onclick="backToDirectory()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    返回文件目录
                </button>
            </div>

            <div id="previewCard" class="file-list-section preview-card">
                <!-- 元数据加载中 -->
                <div id="previewMetaLoading" class="preview-state">
                    <div class="spinner"></div>
                    <p>正在加载文件信息…</p>
                </div>

                <!-- 文件不存在 / 已删除 -->
                <div id="previewMissing" class="preview-state" style="display: none;">
                    <div class="preview-state-icon">⚠️</div>
                    <h2 class="preview-state-title" id="previewMissingTitle">文件不存在</h2>
                    <p class="empty-msg" id="previewMissingMsg">该文件已被删除或分享已失效，请返回文件目录查看最新文件。</p>
                    <button type="button" class="upload-btn" onclick="backToDirectory()">
                        <span>返回文件目录</span>
                    </button>
                </div>

                <!-- 元数据加载失败（可重试，保留当前位置） -->
                <div id="previewMetaError" class="preview-state" style="display: none;">
                    <div class="preview-state-icon">📡</div>
                    <h2 class="preview-state-title">文件信息加载失败</h2>
                    <p class="empty-msg" id="previewMetaErrorMsg"></p>
                    <button type="button" class="upload-btn" onclick="PreviewController.retryMeta()">
                        <span>重试</span>
                    </button>
                </div>

                <!-- 正常内容 -->
                <div id="previewBody" style="display: none;">
                    <div class="preview-header">
                        <div class="file-icon preview-header-icon" id="previewFileIcon">📁</div>
                        <div class="preview-heading">
                            <div class="file-name" id="previewName"></div>
                            <div class="file-size" id="previewSizeLine"></div>
                        </div>
                    </div>

                    <div class="preview-meta-grid">
                        <div class="preview-meta-item">
                            <span class="preview-meta-label">文件类型</span>
                            <span class="preview-meta-value" id="previewType"></span>
                        </div>
                        <div class="preview-meta-item">
                            <span class="preview-meta-label">创建时间</span>
                            <span class="preview-meta-value" id="previewCreatedAt"></span>
                        </div>
                        <div class="preview-meta-item">
                            <span class="preview-meta-label">文件大小</span>
                            <span class="preview-meta-value" id="previewSize"></span>
                        </div>
                        <div class="preview-meta-item preview-meta-item-wide">
                            <span class="preview-meta-label">内容摘要</span>
                            <span class="preview-meta-value" id="previewSummary"></span>
                        </div>
                    </div>

                    <div class="preview-actions" id="previewActions"></div>

                    <div class="preview-content-wrap">
                        <h2>内容预览</h2>
                        <!-- 预览读取中 -->
                        <div id="previewContentLoading" class="preview-state preview-content-state" style="display: none;">
                            <div class="spinner"></div>
                            <p>正在读取文件内容…</p>
                        </div>
                        <!-- 预览失败 / 不支持 -->
                        <div id="previewContentError" class="preview-state preview-content-state" style="display: none;">
                            <div class="preview-state-icon" id="previewErrorIcon">⚠️</div>
                            <p class="empty-msg" id="previewErrorMsg"></p>
                            <button type="button" class="upload-btn" id="previewRetryBtn">
                                <span>重试读取</span>
                            </button>
                        </div>
                        <!-- 预览内容挂载点 -->
                        <div id="previewContent" class="preview-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载动画遮罩 -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loader">
                <div class="spinner"></div>
                <p id="loadingText">加载中...</p>
            </div>
        </div>

        <!-- 身份验证弹窗 -->
        <div id="authModal" class="modal">
            <div class="modal-content">
                <h2>身份验证</h2>
                <p>请输入您的凭据以继续下载</p>
                <form id="authForm">
                    <input type="text" id="username" placeholder="用户名" required autocomplete="username">
                    <input type="password" id="password" placeholder="密码" required autocomplete="current-password">
                    <input type="hidden" id="downloadFileId">
                    <div class="modal-buttons">
                        <button type="button" class="btn-secondary" onclick="closeAuthModal()">取消</button>
                        <button type="submit" class="btn-primary">验证</button>
                    </div>
                    <div id="authError" class="error-msg"></div>
                </form>
            </div>
        </div>

        <!-- 分享设置弹窗 -->
        <div id="shareModal" class="modal">
            <div class="modal-content">
                <h2>创建分享链接</h2>
                <p id="shareFileName" style="margin-bottom: 24px; color: var(--text-primary); font-weight: 500;"></p>
                
                <div class="form-group">
                    <label>有效期（小时）</label>
                    <select id="expireHours">
                        <option value="1">1 小时</option>
                        <option value="6">6 小时</option>
                        <option value="24" selected>24 小时</option>
                        <option value="72">3 天</option>
                        <option value="168">7 天</option>
                        <option value="-1">永久有效</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>最大下载次数</label>
                    <select id="maxDownloads">
                        <option value="1">1 次</option>
                        <option value="3">3 次</option>
                        <option value="5">5 次</option>
                        <option value="10" selected>10 次</option>
                        <option value="100">100 次</option>
                        <option value="-1">无限制</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeShareModal()">取消</button>
                    <button type="button" class="btn-primary" onclick="confirmCreateShare()">生成链接</button>
                </div>
                <div id="shareError" class="error-msg"></div>
            </div>
        </div>

        <!-- 分享成功弹窗 -->
        <div id="shareSuccessModal" class="modal">
            <div class="modal-content">
                <h2>分享链接已生成</h2>
                <p>您可以将以下链接分享给他人</p>
                
                <div class="share-link-box">
                    <input type="text" id="shareLinkInput" readonly>
                    <button class="copy-btn" onclick="copyShareLink()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copyBtnText">复制</span>
                    </button>
                </div>
                
                <div class="share-info">
                    <div class="info-item">
                        <span class="info-label">文件名称</span>
                        <span id="shareInfoName" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">有效期至</span>
                        <span id="shareInfoExpire" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">下载次数</span>
                        <span id="shareInfoDownloads" class="info-value"></span>
                    </div>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeShareSuccessModal()">关闭</button>
                    <button type="button" class="btn-primary" onclick="copyShareLink()">复制链接</button>
                </div>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
